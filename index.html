<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Remix Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🎵 Remix Studio</h1>

    <div class="header-bar">
        <button onclick="saveProject()">💾 Save</button>
        <button onclick="loadProject()">📂 Load</button>
        <button onclick="exportAudio()">⬇️ Export</button>
        <button onclick="undoAction()">↶ Undo</button>
        <button onclick="redoAction()">↷ Redo</button>
        <button onclick="resetAll()">🔄 Reset</button>
    </div>

    <div class="song-section">
        <button class="add-song-btn" onclick="document.getElementById('songInput').click()">
            + Add Song (MP3/WAV)
        </button>
        <input type="file" id="songInput" accept="audio/*" style="display:none" onchange="loadSong(event)">
        <div class="song-info" id="songInfo">No song loaded</div>

        <div class="waveform-container">
            <canvas id="waveformCanvas"></canvas>
            <div class="playhead" id="playhead"></div>
        </div>

        <div class="time-display" id="timeDisplay">0:00 / 0:00</div>

        <div class="timeline-wrapper">
            <div class="timeline-label">📍 Timeline — tap/drag to add effect blocks</div>
            <div class="timeline" id="timeline"></div>
            <div class="timeline-controls">
                <button class="timeline-btn" onclick="openBlockModal()">+ Add Block</button>
                <button class="timeline-btn" id="loopBtn" onclick="toggleLoop()">🔁 Loop: OFF</button>
                <button class="timeline-btn" onclick="previewAll()">👁 Preview</button>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" id="playBtn" onclick="togglePlay()">▶ Play</button>
            <button class="control-btn" onclick="stopAudio()">⏹ Stop</button>
        </div>
    </div>

    <div class="effects-section">
        <div class="effect-category">
            <div class="category-title">🎸 Bass Effects</div>
            <div class="effects-grid" id="bassEffects"></div>
        </div>
        <div class="effect-category">
            <div class="category-title">🎧 Remix Effects</div>
            <div class="effects-grid" id="remixEffects"></div>
        </div>
        <div class="effect-category">
            <div class="category-title">🔊 Sound Effects</div>
            <div class="effects-grid" id="soundEffects"></div>
        </div>
    </div>

    <div class="custom-effects-section">
        <div class="category-title">🎨 My Custom Effects & Sounds</div>
        <button class="add-song-btn" onclick="openCustomModal()">+ Add Custom Effect/Sound</button>
        <div class="effects-grid" id="customEffects"></div>
    </div>
</div>

<!-- Custom Effect Modal -->
<div class="modal" id="customModal">
    <div class="modal-content">
        <h2>Add Custom Effect/Sound</h2>
        <label>Audio File:</label>
        <input type="file" id="customAudioInput" accept="audio/*">
        <label>Effect Name:</label>
        <input type="text" id="customName" placeholder="e.g. My Bass Drop">
        <label>Color:</label>
        <input type="color" id="customColor" value="#ff6b6b">
        <label>Type:</label>
        <select id="customType">
            <option value="hold">Hold to Play</option>
            <option value="tap">Tap to Play Full</option>
        </select>
        <div class="modal-buttons">
            <button class="modal-btn save-btn" onclick="saveCustomEffect()">💾 Save</button>
            <button class="modal-btn cancel-btn" onclick="closeModal('customModal')">❌ Cancel</button>
        </div>
    </div>
</div>

<!-- Block Modal -->
<div class="modal" id="blockModal">
    <div class="modal-content">
        <h2>Add Effect Block</h2>
        <label>Effect Name:</label>
        <input type="text" id="blockEffectName" placeholder="e.g. Bass Boost">
        <label>Start Time (sec):</label>
        <input type="number" id="blockStart" value="0" step="0.1">
        <label>End Time (sec):</label>
        <input type="number" id="blockEnd" value="10" step="0.1">
        <label>Color:</label>
        <input type="color" id="blockColor" value="#4facfe">
        <div class="modal-buttons">
            <button class="modal-btn save-btn" onclick="saveBlock()">💾 Save</button>
            <button class="modal-btn cancel-btn" onclick="closeModal('blockModal')">❌ Cancel</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
