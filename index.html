<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nahi's Remix Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <header class="app-header">
        <h1><i class="fa-solid fa-headphones"></i> Remix Studio</h1>
        <p>Hold effects to remix your music</p>
    </header>

    <!-- Song Import -->
    <section class="song-section">
        <input type="file" id="audioFile" accept="audio/*" hidden>
        <button onclick="document.getElementById('audioFile').click()" class="btn-primary">
            <i class="fa-solid fa-folder-open"></i> Choose Song
        </button>
        <p id="fileName" class="file-name">No song selected</p>
    </section>

    <!-- Visualizer -->
    <canvas id="visualizer"></canvas>

    <!-- Player Controls -->
    <section class="player-section">
        <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>
        <input type="range" id="seekBar" min="0" max="100" value="0" class="seek-bar">
        <div class="player-buttons">
            <button id="playBtn" class="btn-control" disabled>
                <i class="fa-solid fa-play"></i>
            </button>
            <button id="stopBtn" class="btn-control" disabled>
                <i class="fa-solid fa-stop"></i>
            </button>
        </div>
    </section>

    <!-- Remix Effects Grid -->
    <section class="effects-section">
        <h2><i class="fa-solid fa-sliders"></i> Remix Effects <span class="hint">(Hold to Apply)</span></h2>
        <div class="effects-grid" id="effectsGrid">
            <!-- Effects will be added by JS -->
        </div>
    </section>

    <!-- Customization Sliders -->
    <section class="customize-section" id="customizeSection" style="display:none;">
        <h2><i class="fa-solid fa-sliders"></i> Customize: <span id="activeEffectName">Bass</span></h2>
        <div class="slider-group">
            <label>Intensity</label>
            <input type="range" id="intensitySlider" min="0" max="100" value="70">
            <span id="intensityValue">70%</span>
        </div>
        <div class="slider-group">
            <label>Volume</label>
            <input type="range" id="volumeSlider" min="0" max="100" value="80">
            <span id="volumeValue">80%</span>
        </div>
        <div class="slider-group">
            <label>Frequency</label>
            <input type="range" id="freqSlider" min="20" max="2000" value="100">
            <span id="freqValue">100 Hz</span>
        </div>
    </section>

    <!-- Sound Library -->
    <section class="sounds-section">
        <h2><i class="fa-solid fa-music"></i> Sound Library</h2>
        <div class="sounds-grid" id="soundsGrid">
            <!-- Sounds will be added by JS -->
        </div>
        <input type="file" id="customSound" accept="audio/*" hidden>
        <button onclick="document.getElementById('customSound').click()" class="btn-secondary">
            <i class="fa-solid fa-plus"></i> Upload Your Sound
        </button>
    </section>

    <!-- Export Section -->
    <section class="export-section">
        <button id="exportBtn" class="btn-export" disabled>
            <i class="fa-solid fa-download"></i> Export as MP3
        </button>
        <div id="exportProgress" class="export-progress" style="display:none;">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p id="exportStatus">Processing...</p>
        </div>
    </section>
</div>

<!-- lamejs for MP3 encoding -->
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<script src="script.js"></script>

<script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>

</body>
</html>
